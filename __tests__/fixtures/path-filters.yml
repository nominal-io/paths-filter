# Sample path filters mirroring the scout repository configuration
run-tests:
  - ".github/workflows/test.yml"
  - ".github/actions/test-composite/**"
  - "!.github/workflows/**"
  - "!.github/actions/**"
  - "!docs/**"
  - "!**/*.md"
  - "!README*"
  - "!**/CHANGELOG.md"
  - "!local/**"
  - "!git-hooks/**"
  - "!Brewfile*"
  - "!.run/**"
  - "!.vscode/**"
  - "!.idea/**"
  - "!.cursor/**"
  - "!.gitignore"
  - "!.gitattributes"
  - "!renovate.json*"
  - "!.baseline/**"
  - "!infra/**"
  - "!**/charts/**"
  - "!apps/service/**"
  - "!.github/.release-please-manifest.json"
  - "!.github/release-please-config.json"
  - "!uv.lock"
  - "!pyproject.toml"
